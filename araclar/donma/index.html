<!doctype html>
<meta charset="utf-8">
<title>donma ayıklama</title>
<!-- Freeze isolation page (development). Renders a fullscreen WebGL2 quad every vsync; YUK (iterations) sets the
     GPU cost: 0 = clear only. Reports rAF intervals to the host in the window's perf format every 10 s, and in a
     plain browser keeps the same numbers in window.__donma. -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script>
const YUK = +(location.hash.replace('#', '') || window.DONMA_YUK || 0);
const host = window.chrome && window.chrome.webview;
const send = s => host && host.postMessage(s);
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false });
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener('resize', size);
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const fs = `#version 300 es
precision highp float; uniform float t; uniform int n; out vec4 o;
void main(){ vec2 u = gl_FragCoord.xy * 0.001; float a = 0.;
  for (int i = 0; i < n; i++) { a += sin(u.x * float(i) + t) * cos(u.y * 1.3 + a); }
  o = vec4(0.02 + 0.01 * sin(a), 0.02, 0.03, 1.); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't'), un = gl.getUniformLocation(pr, 'n');
let last = 0, win = [], at = performance.now(), t0 = performance.now(), gaps = [];
window.__donma = { gaps, win };
function frame(now) {
  if (last) { const d = now - last; win.push(d); if (d > 100) gaps.push([((now - t0) / 1000).toFixed(1), d.toFixed(0)]); }
  last = now;
  gl.viewport(0, 0, cv.width, cv.height);
  if (YUK > 0) { gl.useProgram(pr); gl.uniform1f(ut, now / 1000); gl.uniform1i(un, YUK); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  else { gl.clearColor(0, 0, 0.02 + 0.01 * Math.sin(now / 500), 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  if (now - at > 10000) {
    at = now;
    const a = win.slice().sort((x, y) => x - y), q = f => a[Math.min(a.length - 1, Math.floor(f * a.length))];
    const med = q(0.5);
    send(`perf:kare p50=${med.toFixed(1)} p95=${q(0.95).toFixed(1)} p99=${q(0.99).toFixed(1)} max=${a[a.length - 1].toFixed(1)} uzun=${a.filter(x => x > 2 * med).length} n=${a.length} donma-sayfasi yuk=${YUK} ${cv.width}x${cv.height}`);
    win.length = 0;
  }
  requestAnimationFrame(frame);
}
send('ready');
requestAnimationFrame(frame);
</script>
