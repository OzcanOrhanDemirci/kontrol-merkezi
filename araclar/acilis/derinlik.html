<!DOCTYPE html><html><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
// The pack's mesh (static geometry, rotors and levers at rest) rasterised plain, each pixel its surface's world z
// (24-bit packed over -400..+20 m). araclar/acilis_kareler.py splits the loading screen's light into circuits by it.
'use strict';
const c = document.getElementById('c');
const gl = c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
let prog; const draws = [];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
const inflate = async r => new Response(r.body.pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();
function mesh(bytes, stride, nv, index) {
  const va = gl.createVertexArray(); gl.bindVertexArray(va);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, bytes, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, index, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  return va;
}
async function load() {
  const pack = await (await fetch('/sahne/sahne.json')).json();
  const buf = await inflate(await fetch('/sahne/' + pack.geometri.dosya));
  const dv = new DataView(buf), nv = dv.getUint32(4, true), ni = dv.getUint32(8, true), stride = dv.getUint32(12, true);
  const va = mesh(new Uint8Array(buf, 16, nv * stride), stride, nv, new Uint8Array(buf, 16 + nv * stride, ni * 4));
  for (const r of pack.geometri.araliklar) draws.push({ va, ilk: r.ilk, sayi: r.sayi });
  for (const d of pack.dinamik) {
    if (!/rotor|kol_/.test(d.ad)) continue;
    const b = await inflate(await fetch('/sahne/' + d.dosya));
    const v = new DataView(b), n = v.getUint32(4, true), i = v.getUint32(8, true), st = v.getUint32(12, true);
    const X = norm(d.eksen), Y = norm(sub([0, 1, 0], X.map(q => q * dot([0, 1, 0], X)))), Z = cross(X, Y);
    const out = new Uint8Array(n * st); out.set(new Uint8Array(b, 16, n * st)); const od = new DataView(out.buffer);
    for (let k = 0; k < n; k++) {             // the part's own frame (its axis x) into the world, at angle 0
      const o = k * st, x = od.getFloat32(o, true), y = od.getFloat32(o + 4, true), z = od.getFloat32(o + 8, true);
      for (let a = 0; a < 3; a++) od.setFloat32(o + a * 4, d.merkez[a] + X[a] * x + Y[a] * y + Z[a] * z, true);
    }
    const v2 = mesh(out, st, n, new Uint8Array(b, 16 + n * st, i * 4));
    for (const r of d.araliklar) draws.push({ va: v2, ilk: r.ilk, sayi: r.sayi });
  }
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
    layout(location=0) in vec3 p; uniform mat4 VP; out float z; void main(){ z = p.z; gl_Position = VP * vec4(p, 1.); }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float; in float z; out vec4 o;
    void main(){ float v = clamp((z + 400.) / 420., 0., 1.) * 16777215.; float r = floor(v / 65536.); v -= r * 65536.;
      float g = floor(v / 256.); o = vec4(vec3(r, g, v - g * 256.) / 255., 1.); }`));
  gl.linkProgram(prog);
  window.ready = true;
}
function lookAt(e, t) {
  const f = norm(sub(t, e)), s = norm(cross(f, [0, 1, 0])), u = cross(s, f);
  return [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1];
}
function mul(a, b) { const o = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) o[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k]; return o; }
window.draw = (w, h, eye, target, fov) => {
  c.width = w; c.height = h; gl.viewport(0, 0, w, h);
  const f = 1 / Math.tan(fov * Math.PI / 360), n = 0.05, fa = 2000;
  const P = [f / (w / h), 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
  gl.useProgram(prog);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, 'VP'), false, mul(P, lookAt(eye, target)));
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.clearColor(1, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  for (const r of draws) { gl.bindVertexArray(r.va); gl.drawElements(gl.TRIANGLES, r.sayi, gl.UNSIGNED_INT, r.ilk * 4); }
  gl.finish();
  return c.toDataURL('image/png');
};
load().catch(e => { window.failure = String(e); });
</script></body></html>
