<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrol Merkezi</title>
<style>
/* Kontrol Merkezi: iki sekme, üç düğme. Sahne WebGL2 ile yol izlenerek çizilir (golge.js),
   ışığı kasanın o anki rengidir. Yazılar bu katmanda durur ve sahnedeki nesnelere iliştirilir.
   WebView2 dışında sahte servisle çalışır (benzetim.js); F1 kısayolları gösterir. */

@font-face { font-family: "Instrument Serif"; src: url(fonts/InstrumentSerif-Regular.woff2) format("woff2"); font-style: normal; }
@font-face { font-family: "Instrument Serif"; src: url(fonts/InstrumentSerif-Italic.woff2) format("woff2"); font-style: italic; }
@font-face { font-family: "Plex Mono"; src: url(fonts/IBMPlexMono-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Plex Mono"; src: url(fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Barlow Semi Condensed"; src: url(fonts/BarlowSemiCondensed-Medium.woff2) format("woff2"); font-weight: 500; }

:root {
  --fg: 238 233 225;
  --acc: 200 215 235;      /* kasanın ışığı (sahneyle aynı renk) */
  --lit: 0;
  --pad: clamp(18px, 2.4vw, 46px);
  --fs: clamp(9px, .62vw, 12.5px);
  --mono: "Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Instrument Serif", Georgia, serif;
  --eng: "Barlow Semi Condensed", "Plex Mono", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #000; }
body {
  color: rgb(var(--fg)); font-family: var(--mono); font-size: var(--fs);
  -webkit-user-select: none; user-select: none; cursor: default;
  -webkit-font-smoothing: antialiased;
}
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; opacity: var(--lit); }
.hit { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; outline: none; }

/* sol üst: ad */
#brand { position: absolute; left: var(--pad); top: calc(var(--pad) - 6px); }
#brand .t { font-family: var(--serif); font-size: clamp(22px, 1.75vw, 38px); line-height: 1; letter-spacing: .004em; }
#brand .t i { color: rgb(var(--fg) / .55); }
#brand .m { margin-top: .8em; font-size: .86em; letter-spacing: .24em; color: rgb(var(--fg) / .36); white-space: nowrap; }

/* üst orta: sekmeler */
#tabs { position: absolute; left: 50%; top: calc(var(--pad) - 4px); transform: translateX(-50%); display: flex; gap: clamp(18px, 2.2vw, 44px); }
#tabs button {
  position: relative; padding: .7em .2em 1.1em; cursor: pointer;
  font-family: var(--eng); font-size: 1.32em; letter-spacing: .34em; text-indent: .34em;
  color: rgb(var(--fg) / .34); transition: color .5s;
}
#tabs button:hover { color: rgb(var(--fg) / .7); }
#tabs button.on { color: rgb(var(--fg) / .95); }
#tabs button::after {
  content: ""; position: absolute; left: 50%; bottom: .2em; height: 1px; width: 0; transform: translateX(-50%);
  background: rgb(var(--acc)); box-shadow: 0 0 10px 1px rgb(var(--acc) / .8); transition: width .7s cubic-bezier(.2,.8,.2,1);
}
#tabs button.on::after { width: 100%; }

/* sağ üst: pencere */
#win { position: absolute; right: calc(var(--pad) - 14px); top: calc(var(--pad) - 16px); display: flex; gap: 2px; }
#win button { width: 36px; height: 32px; color: rgb(var(--fg) / .32); display: grid; place-items: center; border-radius: 7px; transition: color .2s, background .2s; }
#win button:hover { color: rgb(var(--fg) / .85); background: rgb(var(--fg) / .06); }
#win button.x:hover { color: #ffb4a8; background: rgb(255 80 60 / .14); }
#win svg { width: 11px; height: 11px; }

/* bağlantı ve uyarı şeridi */
#banner {
  position: absolute; left: 50%; top: calc(var(--pad) + 4.2em); transform: translateX(-50%);
  white-space: nowrap; letter-spacing: .08em; color: rgb(255 214 170 / .85); opacity: 0; transition: opacity .6s;
  display: flex; align-items: center; gap: .9em;
}
#banner.show { opacity: 1; }
#banner i { width: 6px; height: 6px; border-radius: 50%; background: #ffb46a; box-shadow: 0 0 10px #ff9a40; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* panel: sekmeye göre görünür; konumlar sahneden hesaplanır */
.panel { position: absolute; inset: 0; transition: none; }
.anch { position: absolute; left: 0; top: 0; will-change: transform; }

/* fan modülü yazısı */
.mod { width: clamp(240px, 17vw, 400px); }
#mKasa { transform: translateX(-100%); text-align: right; }
#mGpu { text-align: left; }
#mKasa .st { justify-content: flex-end; } #mGpu .st { justify-content: flex-start; }
#mKasa table { margin-left: auto; margin-right: 0; } #mGpu table { margin-left: 0; }
#mKasa .note { margin-left: auto; margin-right: 0; } #mGpu .note { margin-left: 0; }
.mod .k { font-size: .92em; letter-spacing: .3em; color: rgb(var(--fg) / .5); white-space: nowrap; }
.mod .st { margin-top: .75em; font-size: 1em; letter-spacing: .2em; white-space: nowrap; color: rgb(var(--sc, var(--fg)) / .95); display: flex; align-items: center; gap: .7em; }
.mod .st i { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--sc, var(--fg))); box-shadow: 0 0 12px rgb(var(--sc, var(--fg)) / .9); }
.mod .st.busy i { animation: pulse .7s ease-in-out infinite; }
.mod .big { margin-top: .12em; font-family: var(--serif); font-size: clamp(54px, 4.3vw, 92px); line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.mod .big small { font-family: var(--mono); font-size: .17em; letter-spacing: .14em; color: rgb(var(--fg) / .45); margin-left: .5em; vertical-align: .9em; }
.mod table { margin: .9em auto 0; border-collapse: collapse; }
.mod td { padding: .2em 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mod td.n { color: rgb(var(--fg) / .42); letter-spacing: .12em; padding-right: 2.2em; text-align: left; }
.mod td.v { color: rgb(var(--fg) / .88); font-weight: 500; letter-spacing: .04em; text-align: right; min-width: 4.6em; }
.mod .hint { margin-top: 1.1em; letter-spacing: .1em; color: rgb(var(--fg) / .4); white-space: nowrap; transition: color .3s; }
.mod .hint b { font-weight: 500; color: rgb(var(--fg) / .75); }
.mod.focus .hint { color: rgb(var(--fg) / .7); }
.mod .why { margin-top: 1.1em; letter-spacing: .06em; color: rgb(255 196 160 / .85); white-space: normal; line-height: 1.5; }
.mod .note { margin: 1em auto 0; max-width: 22em; letter-spacing: .04em; line-height: 1.55; color: rgb(255 205 150 / .78); font-family: var(--mono); }
.mod .note em { font-family: var(--serif); font-style: italic; font-size: 1.2em; letter-spacing: .01em; color: rgb(255 214 170 / .95); }

/* görünmez düğmeler: sahnedeki nesnenin üstünde */
.hot { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; border-radius: 14px; }
.hot[aria-disabled="true"] { cursor: not-allowed; }

/* RGB sekmesi */
.col { position: absolute; width: clamp(240px, 16vw, 360px); }
.col .h { font-size: .86em; letter-spacing: .3em; color: rgb(var(--fg) / .34); margin-bottom: 1.1em; white-space: nowrap; }
.col .line { font-family: var(--serif); font-size: clamp(22px, 1.55vw, 34px); line-height: 1.1; }
.col .line i { color: rgb(var(--fg) / .55); }
.col .sub { margin-top: .6em; letter-spacing: .06em; color: rgb(var(--fg) / .5); line-height: 1.6; white-space: nowrap; }
.col .sub b { font-weight: 500; color: rgb(var(--fg) / .82); font-variant-numeric: tabular-nums; }
.col .gap { height: 2.6em; }
.col .jv { display: flex; align-items: center; gap: .8em; letter-spacing: .1em; color: rgb(var(--fg) / .8); white-space: nowrap; }
.col .jv i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--jc, 140 150 160)); box-shadow: 0 0 12px rgb(var(--jc, 140 150 160) / .8); }
.col .jv.breathe i { animation: pulse 3.2s ease-in-out infinite; }
.col .jv.think i { animation: pulse .9s ease-in-out infinite; }
#devs { text-align: right; }
#devs .d { display: flex; justify-content: flex-end; align-items: baseline; gap: 1.2em; margin-bottom: .95em; white-space: nowrap; }
#devs .d .a { letter-spacing: .08em; color: rgb(var(--fg) / .8); }
#devs .d .s { letter-spacing: .14em; font-size: .88em; color: rgb(var(--fg) / .42); min-width: 6.5em; text-align: left; display: flex; align-items: center; gap: .6em; }
#devs .d .s i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
#devs .d.ok .s { color: rgb(150 230 190 / .8); }
#devs .d.ok .s i { box-shadow: 0 0 8px rgb(150 230 190); }
#devs .d.lock .s { color: rgb(var(--fg) / .38); }
#devs .d.bad .s { color: rgb(255 170 140 / .8); }
#tog { width: 30em; transform: translateX(-50%); text-align: center; }
#tog .st { font-family: var(--serif); font-size: clamp(30px, 2.3vw, 50px); line-height: 1; }
#tog .hint { margin-top: .9em; letter-spacing: .12em; color: rgb(var(--fg) / .4); white-space: nowrap; }
#tog.focus .hint { color: rgb(var(--fg) / .72); }
#tog .why { margin-top: .8em; color: rgb(255 196 160 / .85); letter-spacing: .06em; }
.tick { transform: translate(-50%, -50%); font-family: var(--eng); font-size: 1.12em; letter-spacing: .08em; color: rgb(var(--fg) / .5); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick small { font-size: .78em; color: rgb(var(--fg) / .35); margin-left: .1em; }
.tick .ad { display: block; margin-top: .25em; text-align: center; font-family: var(--mono); font-size: .68em; letter-spacing: .1em; color: rgb(var(--fg) / .32); }
#now { transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
#now .v { font-family: var(--serif); font-size: clamp(34px, 2.6vw, 58px); line-height: 1; font-variant-numeric: tabular-nums; }
#now .v small { font-family: var(--mono); font-size: .3em; vertical-align: .95em; margin-left: .15em; color: rgb(var(--fg) / .55); }
#now .l { font-size: .86em; letter-spacing: .26em; text-indent: .26em; color: rgb(var(--fg) / .4); margin-bottom: .5em; }

/* alt orta: defter (bu kadar basit bir iş için harcanan ışık) */
#ledger { position: absolute; left: 50%; bottom: calc(var(--pad) - 8px); transform: translateX(-50%); display: flex; gap: 3.2em; white-space: nowrap; font-size: .86em; letter-spacing: .2em; color: rgb(var(--fg) / .28); }
#ledger b { font-weight: 500; color: rgb(var(--fg) / .58); letter-spacing: .08em; font-variant-numeric: tabular-nums; margin-left: .8em; }

/* yalnız benzetimde: kısayollar */
#help { position: absolute; right: var(--pad); bottom: calc(var(--pad) + 2em); padding: 1.4em 1.6em; border-radius: 12px; background: rgb(10 10 12 / .72); backdrop-filter: blur(8px); display: none; line-height: 1.75; letter-spacing: .06em; color: rgb(var(--fg) / .6); }
#help.show { display: block; }
#help b { display: inline-block; min-width: 3.2em; color: rgb(var(--fg) / .9); font-weight: 500; }
#help .h { letter-spacing: .26em; font-size: .86em; color: rgb(var(--fg) / .35); margin-bottom: .6em; }

#standby { position: fixed; left: 50%; top: 47%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #ffcf9e; box-shadow: 0 0 14px 2px rgb(255 160 90 / .5); animation: breathe 2.4s ease-in-out infinite; transition: opacity .5s; }
@keyframes breathe { 0%, 100% { opacity: .18; } 50% { opacity: .62; } }
body.lit #standby { opacity: 0; animation: none; }
#fallback { display: none; position: fixed; inset: 0; place-items: center; color: rgb(var(--fg) / .7); letter-spacing: .1em; }
body.nogl #fallback { display: grid; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <header id="brand">
    <div class="t">Kontrol <i>Merkezi</i></div>
    <div class="m" id="brandSub"></div>
  </header>

  <nav id="tabs" class="hit" role="tablist">
    <button role="tab" data-tab="fan" class="on" id="tabFan"></button>
    <button role="tab" data-tab="rgb" id="tabRgb"></button>
  </nav>

  <nav id="win" class="hit">
    <button data-cmd="minimize" aria-label="Küçült"><svg viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button data-cmd="close" class="x" aria-label="Kapat"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
  </nav>

  <div id="banner"><i></i><span id="bannerText"></span></div>

  <section class="panel" id="pFan">
    <div class="anch" id="aKasa"><div class="mod" id="mKasa"></div></div>
    <div class="anch" id="aGpu"><div class="mod" id="mGpu"></div></div>
  </section>

  <section class="panel" id="pRgb">
    <div class="anch" id="aTog"><div id="tog"><div class="st" id="togSt"></div><div class="hint" id="togHint"></div><div class="why" id="togWhy"></div></div></div>
    <div class="anch" id="aNow"><div id="now"><div class="l" id="nowL"></div><div class="v" id="nowV"></div></div></div>
    <div id="ticks"></div>
    <div class="col" id="cLeft">
      <div class="h" id="hMode"></div>
      <div class="line" id="mode"></div>
      <div class="sub" id="modeSub"></div>
      <div class="gap"></div>
      <div class="h" id="hJarvis"></div>
      <div class="jv" id="jarvis"><i></i><span></span></div>
    </div>
    <div class="col" id="devs"><div class="h" id="hDevs"></div><div id="devList"></div></div>
  </section>

  <footer id="ledger"></footer>
  <div id="help"></div>
</div>

<button class="hot" id="hotKasa" aria-label="İşlemci ve kasa fanları"></button>
<button class="hot" id="hotGpu" aria-label="Ekran kartı fanları"></button>
<button class="hot" id="hotTog" aria-label="Işıklar"></button>

<div id="fallback">Bu pencere WebGL2 olmadan çizilemiyor.</div>
<div id="standby"></div>

<script src="renk.js"></script>
<script src="golge.js"></script>
<script src="ses.js"></script>
<script src="benzetim.js"></script>
<script src="uygulama.js"></script>
</body>
</html>
