<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrol Merkezi</title>
<style>
/* Kontrol Merkezi: one scene, the underground hall (docs/SALON.md). No UI layer: every control and every text is an
   object in the world, drawn by ui/salon/. The top strip of the window is its (invisible) drag zone. */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* transparent until the loading screen is up: the window paints the same picture under the page (Pencere.cs) */
html, body { height: 100%; overflow: hidden; background: transparent; }
body { -webkit-user-select: none; user-select: none; cursor: default; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; visibility: hidden; }
#fallback { display: none; position: fixed; inset: 0; place-items: center; color: rgb(238 233 225 / .7);
  font: 13px "Segoe UI", sans-serif; letter-spacing: .1em; text-align: center; padding: 2em; }
body.nogl { background: #000; }
body.nogl #fallback { display: grid; }

/* The loading screen (acilis.js): the hall in the dark, its lighting circuits striking one by one. Under everything
   the window's own picture (the hall with its lamps at an ember), the same pixels the window painted; over it, in a
   frame of the pictures' own size (.kare, 2560x1440, scaled to the window's height by acilis.js), each circuit's
   picture at opacity 0 until it strikes, and a small board of pilot lamps. It ends as a dissolve into the scene,
   whose first frame is the last picture. Only opacity moves (the compositor's work: smooth while the load holds the
   page's thread). */
@font-face { font-family: KMAcilis; src: url(fonts/BigShouldersStencil-ExtraBold.woff2) format("woff2"); font-display: block; }
@font-face { font-family: KMAcilisMono; font-weight: 500; src: url(fonts/IBMPlexMono-Medium.woff2) format("woff2"); font-display: block; }
#acilis { position: fixed; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; background: #030303; }
#acilis.on { opacity: 1; }
#acilis > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#acilis .kare { position: absolute; left: 50%; top: 0; width: 2560px; height: 1440px; transform-origin: 0 0; }
#acilis .kare img { position: absolute; display: block; opacity: 0; will-change: opacity; }
#acilis .kare img.taban { opacity: 1; }
/* the board: quiet, on the dark floor under the view; lengths in the frame's pixels (14.4 px = 1 % of its height) */
#acilis .pano { position: absolute; left: 0; right: 0; top: 1202px; display: flex; flex-direction: column; align-items: center;
  color: rgb(229 224 207); opacity: 0; transition: opacity 1.2s ease-out; }
#acilis.yazili .pano { opacity: 1; }
#acilis .pano .ad { font: 43px/1 KMAcilis, sans-serif; letter-spacing: .58em; text-indent: .58em; opacity: .62; }
#acilis .pano .sira { display: flex; gap: 22px; margin-top: 30px; }
#acilis .pano .l { position: relative; width: 69px; height: 8px; background: rgb(229 224 207 / .13); }
#acilis .pano .l i { position: absolute; inset: 0; background: #ffc37a; box-shadow: 0 0 16px rgb(255 170 80 / .75); opacity: 0; will-change: opacity; }
#acilis .pano .l b { position: absolute; left: 0; top: 16px; font: 500 19px/1 KMAcilisMono, monospace; letter-spacing: .08em; opacity: .34; }
#acilis .pano .alt { margin-top: 56px; font: 500 21px/1 KMAcilisMono, monospace; letter-spacing: .34em; text-indent: .34em; opacity: .42; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="acilis" aria-hidden="true"><div class="kare"><div class="pano"><div class="ad">KONTROL MERKEZİ</div><div class="sira"></div><div class="alt">AYDINLATMA DEVRELERİ AÇILIYOR</div></div></div></div>
<div id="fallback">Bu pencere WebGL2 olmadan çizilemiyor.</div>
<script src="acilis/katman.js"></script>
<script src="acilis.js"></script>
<script src="renk.js"></script>
<script src="ses.js"></script>
<script src="benzetim.js"></script>
<script src="salon/levha.js"></script>
<script src="salon/salon.js"></script>
<script src="yuruyus.js"></script>
<script src="disari.js"></script>
<script src="uygulama.js"></script>
</body>
</html>
