<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrol Merkezi</title>
<style>
/* Kontrol Merkezi: one scene, the underground hall (docs/SALON.md). No UI layer: every control and every text is an
   object in the world, drawn by ui/salon/. The top strip of the window is its (invisible) drag zone. */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* transparent until the loading screen is up: the window paints the same picture under the page (Pencere.cs) */
html, body { height: 100%; overflow: hidden; background: transparent; }
body { -webkit-user-select: none; user-select: none; cursor: default; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; visibility: hidden; }
#fallback { display: none; position: fixed; inset: 0; place-items: center; color: rgb(238 233 225 / .7);
  font: 13px "Segoe UI", sans-serif; letter-spacing: .1em; text-align: center; padding: 2em; }
body.nogl { background: #000; }
body.nogl #fallback { display: grid; }

/* The loading screen (acilis.js): the hall before its lights strike. Under everything the window's own picture (the
   shaft's thin light through a hatch not yet open, onto a small pool), the same pixels the window painted; over it
   the beam breathes, a stencilled line says what is happening and a slit of light opens with the load. It ends as
   the hatch opens: the beam swells and the picture dissolves into the scene's own strike. Only opacity and transform
   move (the compositor's work: smooth while the load holds the page's thread). */
@font-face { font-family: KMAcilis; src: url(fonts/BigShouldersStencil-ExtraBold.woff2) format("woff2"); font-display: block; }
#acilis { position: fixed; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; background: #030303; }
#acilis.on { opacity: 1; }
#acilis.bitti { opacity: 0; transition: opacity .55s cubic-bezier(.5, 0, .7, 1) .1s; }
#acilis > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#acilis .isik { position: absolute; left: 50%; top: 0; width: 7vh; height: 74vh; margin-left: -3.5vh; opacity: 0;
  background: linear-gradient(90deg, transparent, rgb(255 246 230 / .055) 35%, rgb(255 248 236 / .09) 50%, rgb(255 246 230 / .055) 65%, transparent);
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent);
  animation: km-nefes 5.5s ease-in-out infinite alternate; will-change: opacity, transform; }
@keyframes km-nefes { from { opacity: .15; } to { opacity: 1; } }
#acilis.bitti .isik { animation: none; opacity: 1; transform: scaleX(5.5); transition: transform .45s cubic-bezier(.3, .7, .4, 1); }
#acilis .yazi { position: absolute; left: 0; right: 0; top: 81.2vh; text-align: center; white-space: nowrap;
  font: 2.05vh/1 KMAcilis, sans-serif; letter-spacing: .62em; text-indent: .62em; color: rgb(229 224 207 / .5);
  opacity: 0; transition: opacity 1.4s ease-out; }
#acilis .olcu { position: absolute; left: 50%; top: 85.2vh; width: 26vh; margin-left: -13vh; height: max(2px, .19vh);
  background: rgb(0 0 0 / .55); box-shadow: 0 0 0 1px rgb(255 255 255 / .035); opacity: 0; transition: opacity 1.4s ease-out; }
#acilis .yarik { position: absolute; inset: 0; transform: scaleX(.015); transition: transform .7s cubic-bezier(.2, .6, .3, 1);
  background: linear-gradient(90deg, rgb(255 238 210 / .2), rgb(255 244 226 / .85) 50%, rgb(255 238 210 / .2)); will-change: transform; }
#acilis.yazili .yazi, #acilis.yazili .olcu { opacity: 1; }
#acilis.bitti .yazi, #acilis.bitti .olcu { opacity: 0; transition: opacity .25s ease-in; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="acilis" aria-hidden="true"><div class="isik"></div><div class="yazi">SALON HAZIRLANIYOR</div><div class="olcu"><div class="yarik"></div></div></div>
<div id="fallback">Bu pencere WebGL2 olmadan çizilemiyor.</div>
<script src="acilis.js"></script>
<script src="renk.js"></script>
<script src="ses.js"></script>
<script src="benzetim.js"></script>
<script src="salon/levha.js"></script>
<script src="salon/salon.js"></script>
<script src="yuruyus.js"></script>
<script src="uygulama.js"></script>
</body>
</html>
