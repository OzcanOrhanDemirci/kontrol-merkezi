<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Salon · deneme</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#durum { position: fixed; left: 12px; bottom: 10px; color: #ddd; background: #000a; padding: 6px 10px;
  font: 12px/1.5 Consolas, monospace; white-space: pre; pointer-events: none; }
body.still #durum { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="durum">yükleniyor…</div>
<script src="salon.js"></script>
<script>
'use strict';
// The renderer's test page (developer only): ?base=/sahne/&scale=2  #still renders one frame and logs stats().
// (#still: no frame loop of its own; the test harness draws through window.fixture.)
// Keys: 1 fanlar, 2 rgb, J the journey, R rotor slow / fast / stop, H haze 0.15 / 1, C colours, + - exposure, P pause.
(async () => {
  const q = new URLSearchParams(location.search), still = location.hash === '#still';
  const status = document.getElementById('durum');
  if (still) document.body.classList.add('still');
  const say = t => { status.textContent = t; };
  try {
    const s = await KM_SALON.create(document.getElementById('gl'), {
      base: q.get('base') || '/sahne/', scale: +(q.get('scale') || 2), preserveDrawingBuffer: true,
      debug: q.has('debug'), onProgress: (f, t) => say(Math.round(f * 100) + ' % · ' + t),
    });
    window.salon = s;
    // the live textures a sign and a board would get (ui/salon/levha.js draws the real ones)
    const sign = document.createElement('canvas');
    sign.width = 1024; sign.height = 352;
    const c = sign.getContext('2d');
    c.fillStyle = '#c9c2a8'; c.fillRect(0, 0, 1024, 352);
    c.fillStyle = '#16191b'; c.font = 'bold 230px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('RGB →', 512, 186);
    s.setLevha('tabela_rgb', sign, { emissive: 0 });
    const board = document.createElement('canvas');
    board.width = 1024; board.height = 614;
    const b = board.getContext('2d');
    b.fillStyle = 'rgba(0,0,0,0)'; b.fillRect(0, 0, 1024, 614);
    b.fillStyle = '#ffb347'; b.font = 'bold 92px Consolas'; b.textBaseline = 'top';
    b.fillText('EN YÜKSEK', 60, 60);
    b.font = '60px Consolas'; b.fillStyle = '#f0e6d2';
    b.fillText('İşlemci ısısı   48,5 °C', 60, 230); b.fillText('İşlemci   1.840 dev/dk', 60, 320); b.fillText('Kasa 1    1.210 dev/dk', 60, 410);
    s.setLevha('masa_ekran_kasa', board, { emissive: 0.6 });
    s.setLamp('durak_0', [1.0, 0.35, 0.08], 3);

    const views = s.views, F = {};
    let mode = 'fanlar', u = 0, speed = 0, angle = 0, strength = 0.15, ev = +(q.get('ev') || 1.5), colour = 0, lever = 0, paused = false;
    const lerp = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
    function pathAt(t) {                       // the journey: the views' line, linear (the app's is a spline)
      const P = views.yol, n = P.length - 1, k = Math.min(n - 1, Math.floor(t * n)), f = t * n - k;
      return lerp(P[k], P[k + 1], f);
    }
    function camera() {
      if (mode === 'rgb') { s.setCamera(views.rgb.goz, views.rgb.hedef, views.rgb.fov); return; }
      if (mode === 'yol') { const e = pathAt(u), a = pathAt(Math.min(1, u + 0.08)); s.setCamera(e, [a[0], a[1] + 0.8, a[2] - 4], 50); return; }
      s.setCamera(views.fanlar.goz, views.fanlar.hedef, views.fanlar.fov);
    }
    function colours() {
      const warm = [[1.0, 0.55, 0.22], [1.0, 0.32, 0.1]], cold = [[0.25, 0.55, 1.0], [0.2, 0.45, 1.0]];
      const k = colour ? cold : warm;
      s.setGroup(0, k[0], 1); s.setGroup(1, k[1], 1); s.setGroup(2, [1.0, 0.78, 0.52], 1);
    }
    const haze = () => s.setHaze({ density: 1, fans: [{ name: 'fan_kasa', strength }] });
    colours(); haze(); camera(); s.setExposure(ev);
    // for the test harness: a still with given settings (deterministic: time and angle are set, not accumulated)
    window.fixture = {
      set(o) {
        if (o.mode) mode = o.mode;
        if (o.u != null) u = o.u;
        if (o.revs != null) speed = o.revs;
        if (o.angle != null) angle = o.angle;
        if (o.strength != null) { strength = o.strength; haze(); }
        if (o.ev != null) { ev = o.ev; s.setExposure(ev); }
        if (o.hover !== undefined) s.setHover(o.hover);
        if (o.lever != null) s.setLever('kol_kasa', o.lever);
        if (o.animColour != null) this.animColour = o.animColour;
        camera();
      },
      draw(t, shutter) {
        if (this.animColour && t != null) s.setGroup(0, [1.0, 0.55 + 0.3 * Math.sin(t), 0.22], 1);
        if (t != null) s.setTime(t - 1 / 33);
        s.setRotor('fan_kasa_rotor', angle, speed * 2 * Math.PI);
        s.render(1 / 33, shutter || 1 / 33);
        return s.stats();
      },
    };
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === '1') mode = 'fanlar';
      if (k === '2') mode = 'rgb';
      if (k === 'j') { mode = 'yol'; u = 0; }
      if (k === 'r') speed = speed === 0 ? 0.3 : speed < 1 ? 3 : 0;
      if (k === 'h') { strength = strength < 0.5 ? 1 : 0.15; haze(); }
      if (k === 'c') { colour ^= 1; colours(); }
      if (k === 'l') { lever = lever ? 0 : -1.05; s.setLever('kol_kasa', lever); }
      if (k === '+' || k === '=') s.setExposure(ev += 0.5);
      if (k === '-') s.setExposure(ev -= 0.5);
      if (k === 'p') paused = !paused;
      camera();
    });
    window.addEventListener('pointermove', e => s.setHover(s.pick(e.clientX, e.clientY)));
    window.addEventListener('resize', () => s.resize());
    window.ready = true;
    if (still) { s.render(1 / 33, 1 / 33); console.log('SALON_STATS ' + JSON.stringify(s.stats())); return; }
    let last = 0, n = 0;
    const frame = now => {
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60;
      last = now;
      if (!paused) {
        angle += speed * 2 * Math.PI * dt;
        if (mode === 'yol') { u = Math.min(1, u + dt / 14); camera(); }
        s.setRotor('fan_kasa_rotor', angle, speed * 2 * Math.PI);
        s.render(dt, dt);
      }
      if (++n % 30 === 0) {
        const st = s.stats();
        say('1 fanlar · 2 rgb · J yol · R rotor · H hava · C renk · L kol · +/- pozlama · P dur\n' +
          'gpu ' + (st.gpuMs != null ? st.gpuMs.toFixed(2) : '?') + ' ms  ' + JSON.stringify(st.passes) + '\n' +
          st.size.join('×') + ' · sahne ' + st.scene.join('×') + ' · ' + st.memoryMB + ' MB');
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  } catch (e) {
    say('HATA: ' + e.message);
    window.failure = e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
